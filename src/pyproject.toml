[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogengine-legal"
version = "0.1.1"
description = "Contract text modeling tools"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.scripts]
legal-case = "legal.case_cli:main"
legal-vocab = "legal.vocab_cli:main"
legal-preprocess = "legal.preprocess_cli:main"

[tool.setuptools]
packages = ["legal"]
include-package-data = false

[tool.setuptools.package-data]
legal = ["schema.sql", "config/units.v1.json"]
